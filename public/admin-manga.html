<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Manga</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/MLbig.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="main-header">
    <nav class="navbar">
      <div class="nav-container">
        <ul class="nav-links">
          <li><a href="admin.html">Dashboard</a></li>
          <li><a href="admin-manga.html" class="active">Manga</a></li>
          <li><a href="admin-chapter.html">Chapter</a></li>
          <li><a href="admin-pages.html">Pages</a></li>
          <li><a href="admin-ads.html">Ads</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <div class="container">
    <button onclick="logout()" style="float:right;background:#ff4d4d;">Logout</button>

    <h2>Tambah Manga</h2>
    <form id="mangaForm">
      <input type="text" id="title" placeholder="Judul Manga" required>
      <input type="text" id="slug" placeholder="Slug (contoh: solo-leveling)" required>
      <textarea id="description" placeholder="Deskripsi"></textarea>
      <label>Cover Image:</label>
      <input type="file" id="cover" accept="image/*" required>

      <select id="age_rating">
        <option value="13+">13+</option>
        <option value="17+">17+</option>
        <option value="18+">18+</option>
      </select>

      <h3>Genres</h3>
      <div id="genreList" class="genre-checkbox"></div>

      <button type="submit">Upload Manga</button>
    </form>

    <h2>Manga Saya</h2>
    <table id="mangaTable">
      <thead>
        <tr>
          <th>Judul</th>
          <th>Status</th>
          <th>Dibuat</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="admin-manga.js"></script>
</body>
</html>
