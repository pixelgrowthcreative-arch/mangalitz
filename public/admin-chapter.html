<!DOCTYPE html>
<html>
<head>
  <title>Chapter</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/MLbig.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <header class="main-header">
    <nav class="navbar">
      <div class="nav-container">
        <ul class="nav-links">
          <li><a href="admin.html">Dashboard</a></li>
          <li><a href="admin-manga.html">Manga</a></li>
          <li><a href="admin-chapter.html" class="active">Chapter</a></li>
          <li><a href="admin-pages.html">Pages</a></li>
          <li><a href="admin-ads.html">Ads</a></li>
        </ul>
      </div>
    </nav>
  </header>
  
  <div class="container">
    <button onclick="logout()" style="float:right;background:#ff4d4d;">Logout</button>

    <h2>Tambah Chapter</h2>
    <form id="chapterForm">
      <select id="manga_id" required></select>
      <input type="number" id="chapter_number" placeholder="Nomor Chapter" required>
      <input type="text" id="title" placeholder="Judul Chapter">
      <button type="submit">Buat Chapter</button>
    </form>

    <h2>Daftar Chapter</h2>
    <table id="chapterTable">
      <thead>
        <tr>
          <th>Manga</th>
          <th>Chapter</th>
          <th>Judul</th>
          <th>aksi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="admin-chapter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <ul id="chapterList"></ul>
</body>
</html>
