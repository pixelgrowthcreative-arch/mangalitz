<!DOCTYPE html>
<html>
<head>
  <title>Admin Reader Preview</title>
  <style>
    body {
      background:#111;
      color:#fff;
      margin:0;
      font-family:Arial, sans-serif;
    }
    header {
      padding:15px;
      background:#000;
      position:sticky;
      top:0;
      z-index:10;
    }
    img {
      max-width:100%;
      display:block;
      margin:20px auto;
    }
  </style>
</head>
<body>

<header>
  <strong>Admin Reader Preview</strong>
</header>

<div id="pages"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const chapterId = params.get("chapter");
  const token = localStorage.getItem("token");

  if (!chapterId || !token) {
    alert("Unauthorized preview");
    window.close();
  }

  fetch(`http://localhost:3000/api/pages/admin/chapter/${chapterId}`, {
    headers: {
      Authorization: `Bearer ${token}`
    }
  })
  .then(res => res.json())
  .then(pages => {
    const container = document.getElementById("pages");

    if (!pages.length) {
      container.innerHTML = "<p style='text-align:center'>Tidak ada halaman</p>";
      return;
    }

    pages.forEach(p => {
      const img = document.createElement("img");
      img.src = `http://localhost:3000${p.image_url}`;
      container.appendChild(img);
    });
  })
  .catch(() => {
    alert("Gagal load preview");
  });
</script>

</body>
</html>
