<!DOCTYPE html>
<html>
<head>
  <title>MangaLitz</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/MLbig.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="main-header">
    <div class="logo-wrapper">
      <img src="assets/mangalitzz.png" class="logo-icon">
    </div>
  </header>
  
    <div id="top-ad-1" class="ad-banner top-ad">
        IKLAN BANNER 728x90
    </div>

    <div id="top-ad-2" class="ad-banner top-ad">
        IKLAN BANNER 728x90
    </div>

    <div id="top-ad-3" class="ad-banner top-ad">
        IKLAN BANNER 728x90
    </div>    

    <div id="top-ad-4" class="ad-banner top-ad">
        IKLAN BANNER 728x90
    </div>

    <div class="manga-hero" id="hero">
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <img id="cover" class="hero-cover" />
        <div class="hero-info">
        <h1 id="title"></h1>
        <p id="description"></p>
      </div>
    </div>
  </div>

  <div class="container">
    <h2>Chapters</h2>
    <ul id="chapter-list"></ul>
  </div>

    <div id="bottom-ad-1" class="ad-banner bottom-ad">
        IKLAN BANNER 728x90
    </div>

    <div id="bottom-ad-2" class="ad-banner bottom-ad">
        IKLAN BANNER 728x90
    </div>

    <div id="bottom-ad-3" class="ad-banner bottom-ad">
        IKLAN BANNER 728x90
    </div>

    <div id="bottom-ad-4" class="ad-banner bottom-ad">
        IKLAN BANNER 728x90
    </div>

  <script src="script.js"></script>
  <script>loadMangaDetail();</script>
   <script>
      loadMultipleAds("top", "top-ad", 4);
      loadMultipleAds("bottom", "bottom-ad", 4);
  </script>
</body>

</html>
