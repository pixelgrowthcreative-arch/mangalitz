<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>อ่านมังงะแปลไทยฟรี - MangaLitz เว็บอ่านมังงะอันดับ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="อ่านมังงะแปลไทยฟรี MangaLitz เว็บอ่านมังงะพรีเมียม">
  <meta name="keywords" content="อ่านมังงะ, มังงะแปลไทย, อ่านการ์ตูนออนไลน์, manga thai, อ่านมังงะฟรี">
    <!-- OpenGraph -->
  <meta property="og:title" content="MangaLitz - อ่านมังงะแปลไทยฟรี">
  <meta property="og:description" content="อ่านมังงะใหม่ล่าสุดฟรีทุกวัน">
  <meta property="og:type" content="website">


  <link rel="icon" type="image/png" href="assets/MLbig2.ico">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="index.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">

    <div class="logo">
      <img src="assets/mangalitzz.png" alt="MangaLitz">
      <span>MangaLitz</span>
    </div>

    <input class="search" placeholder="Search manga..." oninput="filterManga()">

    <div class="lang">
      <button>TH</button>
      <button>EN</button>
    </div>

  </div>
</header>

<!-- TOP ADS -->
<div class="ads ads-top">TOP BANNER ADS</div>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- LEFT ADS -->
  <aside class="side left">ADS</aside>

  <!-- CONTENT -->
  <main class="content">

    <!-- HERO -->
    <section class="hero">
      <div class="hero-inner">
        <h1>Latest Manga</h1>
        <span class="badge">NEW</span>
      </div>
      <p class="hero-sub">อ่านมังงะใหม่ล่าสุดทุกวัน ฟรี ไม่ต้องสมัคร</p>
    </section>

    <!-- INLINE ADS -->
    <div class="ads ads-inline">INLINE ADS</div>

    <!-- GENRE FILTER -->
    <div id="genre-filters" class="genres"></div>

    <!-- MANGA GRID -->
    <div id="hentai-section" class="grid skeleton"></div>

  </main>

  <!-- RIGHT ADS -->
  <aside class="side right">ADS</aside>

</div>

<!-- BOTTOM ADS -->
<div class="ads ads-bottom">BOTTOM ADS</div>

<footer class="footer">
  © 2026 MangaLitz •
</footer>

<script src="script.js"></script>

<script>
const BASE =
  location.hostname === "localhost"
    ? "http://localhost:3000"
    : location.origin;

const API = BASE + "/api/public/manga";

async function loadMangaList() {
  const container = document.getElementById("hentai-section");

  try {
    const res = await fetch(API);
    const data = await res.json();

    // 🔞 filter 18+
    const mangas = data.filter(m =>
      m.genres?.includes("18+")
    );

    container.classList.remove("skeleton");
    container.innerHTML = "";

    mangas.forEach(manga => {
      const img =
        manga.cover_image?.startsWith("http")
          ? manga.cover_image
          : BASE + manga.cover_image;

      container.innerHTML += `
        <div class="card">
          <img 
            src="${img}" 
            loading="lazy"
            onerror="this.src='assets/no-cover.jpg'"
          >
          <div class="info">${manga.title}</div>
        </div>
      `;
    });

  } catch (err) {
    console.error(err);
    container.innerHTML = "Failed load manga";
  }
}

loadMangaList();
</script>

</body>
</html>
